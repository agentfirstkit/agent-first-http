name: Display Takeover

# The display-takeover suite is flaky by design: it drives a real KasmVNC
# display under the Docker harness. It runs here on a nightly schedule (and on
# demand) in its own workflow so it never gates a merge or a release —
# `wait_for_ci_green` watches ci.yml only.

on:
  schedule:
    - cron: '17 4 * * *'   # nightly, 04:17 UTC
  workflow_dispatch:

# agent-first-data resolves from crates.io here: the development path override
# in .cargo/config.toml is excluded by the release sync and has never existed in
# this repository.

jobs:
  display-takeover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The harness driver is written against the afdata Bash kit; the image it
      # drives is not, and needs nothing here.
      - name: Install afdata
        run: cargo install agent-first-data --locked
      - name: Display-takeover suite (KasmVNC, Docker harness)
        run: tests/test.sh takeover
