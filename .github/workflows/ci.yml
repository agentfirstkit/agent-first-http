name: CI

on:
  pull_request:
  push:
    branches: [main]

# agent-first-data resolves from crates.io here, with no second checkout and
# nothing to undo: the Cargo path override that development uses lives in
# .cargo/config.toml, which the release sync excludes, so it has never existed
# in this repository.

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install afdata skill validator
        run: cargo install agent-first-data --locked --features skill
      - name: Validate Agent Skill and fmt
        run: |
          afdata skill validate skills/agent-first-http
          cargo fmt --all --check
      - name: build --all-features
        run: cargo build --all-features
      - name: build --no-default-features --features sdk
        run: cargo build --no-default-features --features sdk
      - name: SDK-only build excludes chromiumoxide
        run: |
          if cargo tree --no-default-features --features sdk | grep -q chromiumoxide; then
            echo "::error::SDK-only build linked chromiumoxide"
            exit 1
          fi
      - name: clippy --all-features
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: clippy --no-default-features --features sdk
        run: cargo clippy --no-default-features --features sdk --all-targets -- -D warnings

  unit:
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit + bin tests
        run: cargo test --lib --bins --features sdk,cli
      - name: Regression list
        run: bash tests/check_regressions.sh

  integration:
    strategy:
      fail-fast: false
      # Native legs validate the binaries we actually ship (macOS via Homebrew,
      # Windows via Scoop). Linux is covered comprehensively by integration-docker
      # (real chromium + all backends), so there is no ubuntu native leg here —
      # the ubuntu runner's chromium is a confined snap that can't complete
      # download-to-disk tests.
      matrix:
        include:
          - os: macos-latest
            install: ""
            browser_bin: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
          - os: windows-latest
            install: ""
            browser_bin: C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe
    runs-on: ${{ matrix.os }}
    needs: [static]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install browser
        if: matrix.install != ''
        shell: bash
        run: ${{ matrix.install }}
      - name: Browser integration suite
        env:
          AFHTTP_TEST_BROWSER_BIN: ${{ matrix.browser_bin }}
          # Tests poll the deep fetch/host future chain on tokio worker threads;
          # bump their stack so Windows' small default doesn't overflow (the CLI
          # binary handles this itself via a 16 MiB runtime thread). Harmless on
          # macOS/Linux.
          RUST_MIN_STACK: "16777216"
        shell: bash
        run: |
          cargo test --features sdk,cli \
            --test fetch_http_only \
            --test health_capabilities \
            --test cdp_proxy \
            --test browser_fetch \
            --test host_extras

  # Full integration suite through the Docker harness. The cross-platform
  # `integration` job above is a portability smoke (chromium-only flows); this
  # job runs every integration test with all backends (lightpanda, camoufox,
  # fingerprint-chromium) and KasmVNC present — the paths the apt-chromium
  # runners cannot exercise. This is the real integration gate.
  integration-docker:
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The harness builds tests/Dockerfile.test on first use (chromium + 4
      # backends + KasmVNC); Cargo resolves agent-first-data from crates.io.
      - name: Full integration suite (Docker harness)
        run: tests/test.sh integration
