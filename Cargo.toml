[package]
name = "agent-first-http"
version = "0.16.0"
edition = "2024"
rust-version = "1.99"
description = "Give your AI agent its own private browser — so it reads the real page, past logins and bot walls, without ever touching yours."
license = "MIT"
repository = "https://github.com/agentfirstkit/agent-first-http"
readme = "README.md"
# container/docker/{Dockerfile,install-backends.sh,entrypoint.sh} are embedded
# via include_str! in cli/cmd/container.rs, so they must ship in the crate; the
# rest of container/ (compose, dockerignore) is build/deploy-only.
exclude = [".github/", "container/docker/compose.yaml", "container/docker/Dockerfile.dockerignore", "tests/Dockerfile.test", "tests/Dockerfile.test.dockerignore"]

[[bin]]
name = "afhttp"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "manual_display_takeover"
required-features = ["host"]

[features]
default = ["sdk", "cli"]
# The SDK only fetches: it talks to a host over HTTP and returns what the page
# gave. It must not link agent-first-data, agent-first-ui, chromiumoxide or
# axum, even indirectly; tests/check_sdk_floor.sh fails the gate if it does. A
# need for one of them on this floor means the code belongs behind `host`.
sdk = []
host = [
    "dep:chromiumoxide",
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:hyper",
    "dep:hyper-util",
    "dep:agent-first-data",
    "agent-first-ui/session",
]
# The document formats are a CLI concern: `--token-secret file:PATH#DOT_PATH`
# reads a credential out of whatever config file the caller already keeps, and
# refusing a `.toml` because this build lacks a parser would make the source a
# lottery. The SDK floor still links none of them.
cli = [
    "sdk",
    "host",
    "agent-first-data/skill-admin",
    "agent-first-data/stream-redirect",
    "agent-first-data/yaml",
    "agent-first-data/toml",
    "agent-first-data/dotenv",
    "agent-first-data/ini",
]

[dependencies]
# SDK floor — always compiled.
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json", "rustls-no-provider", "gzip", "brotli", "deflate", "stream", "http2", "multipart", "form"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
scraper = { version = "0.29", default-features = false }
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures = "0.3"
dirs = "7"
humantime = "2"
mime_guess = "2"
fs2 = "0.4"
tempfile = "3"
url = "2"
thiserror = "2"
# The public suffix list, compiled in as data. The SDK's cookie jar refuses a
# `Domain` attribute that names a public suffix (`github.io`, `co.uk`), which is
# what keeps one site's cookie from being replayed to its neighbours.
psl = "2"

# Host feature deps — chromiumoxide + the axum listener stack.
#
# agent-first-ui owns the human-UI pieces afhttp would otherwise reimplement:
# the revocable constant-time credential behind every `/takeover/*` URL, and
# the `UiDeliveryPlan` that `afhttp ui takeover` uses to deliver the panel as a
# window, a link, or a registered session. Host-side because the credential
# lives in the listener; the CLI feature turns `host` on, so the delivery plan
# comes with it. These are `session`-tier; afhttp reads no frontend, so it
# takes nothing from the guard tier below it.
agent-first-ui = { version = "0.9.0", default-features = false, optional = true }
chromiumoxide = { version = "0.9", optional = true, default-features = false }
axum = { version = "0.8", optional = true, features = ["ws", "macros"] }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", optional = true, features = ["fs", "trace"] }
hyper = { version = "1", optional = true, features = ["full"] }
hyper-util = { version = "0.1", optional = true, features = ["server-auto", "tokio"] }

# Host and CLI only: both answer with AFDATA protocol events and redact them on
# the way out. The SDK floor reads the host's events with plain serde and never
# links AFDATA; skill administration and stream redirection come with this
# crate's own `cli` feature.
agent-first-data = { version = "0.36.1", default-features = false, features = ["cli"], optional = true }
cookie = "0.18"

[dev-dependencies]
# Tests validate emitted events against the protocol in every feature build.
agent-first-data = { version = "0.36.1", default-features = false, features = ["cli"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
axum = { version = "0.8", features = ["ws", "macros"] }
filetime = "0.2"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
